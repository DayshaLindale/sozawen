<html><body><pre id="out">Checking...</pre>
<script>
fetch('/static/app.html').then(r=>r.text()).then(html => {
    var start = html.indexOf('<script>') + 8;
    var end = html.lastIndexOf('</scr' + 'ipt>');
    var js = html.substring(start, end);
    var out = document.getElementById('out');
    try {
        new Function(js);
        out.textContent = 'JS parses OK! ' + js.split('\n').length + ' lines, no errors.';
    } catch(e) {
        out.textContent = 'ERROR: ' + e.message;
    }
});
</script></body></html>
